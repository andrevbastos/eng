[project]
name = "eng"
version = "0.1.0"
description = "Sistema desktop de gestão de demandas e pareceres da Assessoria Jurídica do IFC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
