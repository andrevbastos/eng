<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Demanda - Assessoria Jurídica IFC</title>
<style>
:root {
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --border-radius-lg: 12px;
  --border-radius-md: 8px;
  --border-radius-sm: 6px;
  --bg-body: #2c2f33;
  --bg-app: #1a1d21;
  --bg-titlebar: #13161a;
  --bg-input: #252930;
  --bg-card: #13161a;
  --bg-btn-sec: #2e333b;
  --bg-btn-sec-hover: #363b44;
  --accent-blue: #3d7ef8;
  --accent-blue-hover: #5590ff;
  --text-muted: rgba(255, 255, 255, 0.45);
  --text-dim: rgba(255, 255, 255, 0.25);
  --text-main: rgba(255, 255, 255, 0.85);
  --border-subtle: rgba(255, 255, 255, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-body);
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  color: var(--text-main);
}
.app {
  background: var(--bg-app);
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  min-height: 640px;
  width: 920px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  border: 0.5px solid rgba(255,255,255,0.06);
  display: flex;
  flex-direction: column;
}
.titlebar {
  background: var(--bg-titlebar);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 0.5px solid rgba(255,255,255,0.07);
}
.dot { width: 10px; height: 10px; border-radius: 50%; }
.titlebar-title {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  margin-left: auto;
  margin-right: auto;
  letter-spacing: 0.5px;
  font-weight: 500;
}
.content {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.section-label {
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.8px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

/* Nav Tabs */
.nav-tabs {
  display: flex;
  gap: 6px;
  background: #13161a;
  padding: 4px;
  border-radius: 8px;
  border: 0.5px solid rgba(255,255,255,0.06);
  width: fit-content;
}
.tab-btn {
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.45);
  font-size: 12px;
  font-weight: 500;
  padding: 7px 20px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  text-decoration: none;
}
.tab-btn:hover { color: #fff; background: rgba(255,255,255,0.04); }
.tab-btn.active {
  background: var(--bg-input);
  color: #fff;
  border: 0.5px solid rgba(255,255,255,0.1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* Form Styles */
.back-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #13161a;
  padding: 10px 14px;
  border-radius: var(--border-radius-md);
  border: 0.5px solid var(--border-subtle);
}
.btn-back {
  background: var(--bg-btn-sec);
  border: 0.5px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 12px;
  color: rgba(255,255,255,0.8);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-back:hover { background: var(--bg-btn-sec-hover); color: #fff; }

.btn-primary {
  background: var(--accent-blue);
  border: none;
  border-radius: 7px;
  padding: 0 20px;
  font-size: 12px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  transition: background 0.15s ease;
}
.btn-primary:hover { background: var(--accent-blue-hover); }

.form-card {
  background: var(--bg-card);
  border: 0.5px solid var(--border-subtle);
  border-radius: var(--border-radius-md);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 480px;
  overflow-y: auto;
}
.form-card::-webkit-scrollbar { width: 6px; }
.form-card::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

.form-grid-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.form-grid-3col {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
}

.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; font-weight: 500; color: var(--text-muted); }
.field input, .field select, .field textarea {
  background: var(--bg-input);
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: var(--border-radius-sm);
  padding: 8px 12px;
  font-size: 12px;
  color: #fff;
  outline: none;
  font-family: inherit;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--accent-blue);
  box-shadow: 0 0 0 2px rgba(61,126,248,0.15);
}
.field textarea { resize: vertical; min-height: 80px; }

.path-input-row { display: flex; gap: 8px; }
.btn-browse {
  background: var(--bg-btn-sec);
  border: 0.5px solid rgba(255,255,255,0.12);
  border-radius: var(--border-radius-sm);
  padding: 0 14px;
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  cursor: pointer;
  white-space: nowrap;
}
.btn-browse:hover { background: var(--bg-btn-sec-hover); color: #fff; }

.tag-selector-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  background: var(--bg-input);
  padding: 8px 10px;
  border-radius: var(--border-radius-sm);
  border: 0.5px solid rgba(255,255,255,0.12);
}
.tag-option {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  cursor: pointer;
  user-select: none;
}
.tag-option input { margin: 0; cursor: pointer; }
.tag-mpf { background: rgba(229, 57, 53, 0.2); color: #ef5350; }
.tag-urgente { background: rgba(255, 152, 0, 0.2); color: #ffb74d; }
.tag-edital { background: rgba(156, 39, 176, 0.2); color: #ba68c8; }

</style>
</head>
<body>

<div class="app">
  <!-- Titlebar -->
  <div class="titlebar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#ffbd2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span class="titlebar-title">Assessoria Jurídica IFC - Formulário de Demanda</span>
  </div>

  <div class="content">

    <!-- Nav Tabs -->
    <div class="nav-tabs">
      <a href="mockup_pesquisa_demandas.html" class="tab-btn active">Demandas Jurídicas</a>
      <a href="mockup_pesquisa_pareceres.html" class="tab-btn">Pareceres da Procuradoria</a>
    </div>

    <!-- Barra de Controle do Formulário -->
    <div class="back-bar">
      <button class="btn-back" onclick="window.location.href='mockup_pesquisa_demandas.html'">← Cancelar e Voltar</button>
      <span style="font-size: 14px; font-weight: 600; color: #fff;">Cadastrar Nova Demanda</span>
      <button class="btn-primary" onclick="alert('Demanda salva com sucesso!'); window.location.href='mockup_pesquisa_demandas.html'">Salvar Demanda</button>
    </div>

    <!-- Card de Formulário -->
    <div class="form-card">
      
      <!-- Seção 1: Dados Principais -->
      <div class="section-label">Dados Principais da Demanda</div>
      <div class="field">
        <label>Alvo / Motivo da Requisição *</label>
        <input type="text" placeholder="Ex: Esclarecimento sobre o Edital de Licitação nº 04/2026..." value="Esclarecimento Edital nº 04/2026">
      </div>

      <div class="form-grid-3col">
        <div class="field">
          <label>Data de Entrada *</label>
          <input type="date" value="2026-08-10">
        </div>
        <div class="field">
          <label>Data Limite para Resposta *</label>
          <input type="date" value="2026-08-20">
        </div>
        <div class="field">
          <label>Status *</label>
          <select>
            <option>Em análise</option>
            <option selected>Em andamento</option>
            <option>Concluída</option>
          </select>
        </div>
      </div>

      <!-- Seção 2: Origem & Arquivos -->
      <div class="section-label" style="margin-top: 6px;">Informações de Origem e Arquivos</div>
      <div class="form-grid-3col">
        <div class="field">
          <label>Canal de Origem</label>
          <select>
            <option selected>E-mail</option>
            <option>SIGAA</option>
            <option>Pessoalmente</option>
            <option>Outros</option>
          </select>
        </div>
        <div class="field">
          <label>Remetente (Quem enviou)</label>
          <input type="text" placeholder="Ex: Proj. MPF Joinville" value="Proj. MPF Joinville">
        </div>
        <div class="field">
          <label>Destinatário (Quem recebeu)</label>
          <input type="text" placeholder="Ex: Assessoria Jurídica IFC" value="Assessoria Jurídica IFC">
        </div>
      </div>

      <div class="field">
        <label>Caminho da Pasta Local dos Documentos</label>
        <div class="path-input-row">
          <input type="text" style="flex: 1;" placeholder="Selecione o diretório local..." value="/docs/2026/demanda_04">
          <button class="btn-browse" type="button" onclick="alert('Selecionar diretório local...')">Procurar Pasta...</button>
        </div>
      </div>

      <!-- Seção 3: Tags & Observações -->
      <div class="section-label" style="margin-top: 6px;">Tags e Observações</div>
      <div class="field">
        <label>Tags de Organização</label>
        <div class="tag-selector-row">
          <label class="tag-option tag-mpf"><input type="checkbox" checked> MPF</label>
          <label class="tag-option tag-urgente"><input type="checkbox" checked> Urgente</label>
          <label class="tag-option tag-edital"><input type="checkbox"> Edital</label>
          <button type="button" class="btn-browse" style="padding: 2px 8px; font-size: 10px;" onclick="alert('Criar nova tag...')">+ Nova Tag</button>
        </div>
      </div>

      <div class="field">
        <label>Observações</label>
        <textarea placeholder="Anotações gerais e lembretes para esta demanda...">Aguardando parecer final da Procuradoria para encaminhamento ao Reitor.</textarea>
      </div>

    </div>

  </div>
</div>

</body>
</html>
